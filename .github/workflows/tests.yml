name: tests

on:
  push:
  pull_request:

jobs:
  core-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: py -m pip install pytest
      - name: Run headless core tests
        run: py -m pytest -q
      - name: Compile source
        run: py -m compileall -q archforge tests
