name: tests

on:
  push:
  pull_request:

jobs:
  core-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest "cadquery-ocp>=8.0.1,<8.1"
      - name: Run headless core tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q
      - name: Compile source
        run: python -m compileall -q archforge tests

  agent-orchestration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install agent test dependencies
        run: python -m pip install pytest -r requirements-agents.txt
      - name: Run LangGraph orchestration tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_langgraph_orchestrator.py
      - name: Compile orchestration source
        run: python -m compileall -q archforge/orchestration scripts/run_langgraph_design.py
